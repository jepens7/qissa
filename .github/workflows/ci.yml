name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Run PR yang tergantikan push baru dibatalkan; run di main dan staging tidak, supaya sinyal sesudah merge
# tetap ada.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Action pihak ketiga dipin ke SHA commit (ARCHITECTURE §12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Versi pnpm diambil dari `packageManager` di package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Aturan konten (QISSA-SCRIPT §6); peringatan muncul sebagai anotasi tanpa memerahkan job.
      - run: pnpm qs lint
      # Gagal bila naskah berubah tanpa memperbarui content/versi-konten.lock.json (ADR-014).
      - run: pnpm qs compile --check
      # Build menjalankan qs compile lalu vite build.
      - run: pnpm build
        env:
          # Variabel wajib apps/web (DATA-CONTRACTS §1); VITE_APP_VERSION diambil dari package.json.
          VITE_SITE_URL: https://qissah.id
          VITE_CONTENT_BASE: /content
      # PRIVACY-SECURITY §3: dependensi dipindai di CI.
      - run: pnpm audit --prod --audit-level=high
      # E2E SRS §9 (ADR-018) terhadap build di atas, lewat vite preview; paling mahal, jadi paling akhir.
      # Tanpa --with-deps: image ubuntu-24.04 sudah memuat library Chrome, sedangkan paket apt tambahannya
      # (font dan pembaruan library) beberapa kali tertahan 11–12 menit di mirror Azure. Bila ada library
      # yang kurang, Playwright gagal sambil menyebut yang hilang.
      - run: pnpm --filter @qissa/web exec playwright install chromium
      - run: pnpm e2e
        env:
          # Sama dengan build, supaya vite preview tidak mencetak peringatan konfigurasi palsu.
          VITE_SITE_URL: https://qissah.id
          VITE_CONTENT_BASE: /content
      # Trace Playwright hanya diunggah bila E2E gagal, untuk diperiksa.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error
