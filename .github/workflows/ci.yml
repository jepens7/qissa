name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Action pihak ketiga dipin ke SHA commit (ARCHITECTURE §12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Versi pnpm diambil dari `packageManager` di package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # Variabel wajib apps/web (DATA-CONTRACTS §1); VITE_APP_VERSION diambil dari package.json.
          VITE_SITE_URL: https://qissa.id
          VITE_CONTENT_BASE: /content
      # PRIVACY-SECURITY §3: dependensi dipindai di CI.
      - run: pnpm audit --prod --audit-level=high --ignore-registry-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error
