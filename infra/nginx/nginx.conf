# qissah.id: apps/web/dist dari infra/nginx/Dockerfile, di belakang proxy TLS Easypanel.

# Aset Vite ber-hash tidak pernah berubah. Selain itu (index.html, sw.js, manifest konten, episode JSON, ikon)
# selalu divalidasi ulang; nama berkas episode tidak memuat versi (ADR-017, SRS §6).
map $uri $kontrol_cache {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Redirect relatif (mis. /privasi ke /privasi/), supaya tidak menunjuk ke http://host:80 di balik proxy.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # PRIVACY-SECURITY §3. Semua add_header ada di level server; location di bawah sengaja tanpa add_header,
  # karena add_header di location membuat header level server tidak diwariskan.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.qissah.id; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://umami.qissah.id; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $kontrol_cache always;

  # ARCHITECTURE §13: dipantau uptime eksternal.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # mime.types bawaan nginx belum mengenal .webmanifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # Routing aplikasi memakai hash (#epNN), jadi server hanya perlu berkas yang ada; selain itu 404.
  location / {
    try_files $uri $uri/ =404;
  }
}
