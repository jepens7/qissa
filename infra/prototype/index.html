main{max-width:440px;margin:0 auto;background:var(--screen);padding:14px 12px 28px}

.dots i:nth-child(3){animation-delay:.4s}

      dalil: '<h2>Apa kata Al-Qur\u2019an dan Sunnah</h2>' +
        '<h4>QS Al-Hujurat 49:12</h4>' +
        '<p class="ar">\u064A\u064E\u0627 \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0622\u0645\u064E\u0646\u064F\u0648\u0627 \u0627\u062C\u0652\u062A\u064E\u0646\u0650\u0628\u064F\u0648\u0627 \u0643\u064E\u062B\u0650\u064A\u0631\u064B\u0627 \u0645\u0650\u0651\u0646\u064E \u0627\u0644\u0638\u064E\u0651\u0646\u0650\u0651 \u0625\u0650\u0646\u064E\u0651 \u0628\u064E\u0639\u0652\u0636\u064E \u0627\u0644\u0638\u064E\u0651\u0646\u0650\u0651 \u0625\u0650\u062B\u0652\u0645\u064C \u06D6 \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u062C\u064E\u0633\u064E\u0651\u0633\u064F\u0648\u0627 \u0648\u064E\u0644\u064E\u0627 \u064A\u064E\u063A\u0652\u062A\u064E\u0628 \u0628\u064E\u0651\u0639\u0652\u0636\u064F\u0643\u064F\u0645 \u0628\u064E\u0639\u0652\u0636\u064B\u0627 \u06DA \u0623\u064E\u064A\u064F\u062D\u0650\u0628\u064F\u0651 \u0623\u064E\u062D\u064E\u062F\u064F\u0643\u064F\u0645\u0652 \u0623\u064E\u0646 \u064A\u064E\u0623\u0652\u0643\u064F\u0644\u064E \u0644\u064E\u062D\u0652\u0645\u064E \u0623\u064E\u062E\u0650\u064A\u0647\u0650 \u0645\u064E\u064A\u0652\u062A\u064B\u0627 \u0641\u064E\u0643\u064E\u0631\u0650\u0647\u0652\u062A\u064F\u0645\u064F\u0648\u0647\u064F \u06DA \u0648\u064E\u0627\u062A\u064E\u0651\u0642\u064F\u0648\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u06DA \u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u062A\u064E\u0648\u064E\u0651\u0627\u0628\u064C \u0631\u064E\u0651\u062D\u0650\u064A\u0645\u064C</p>' +
        '<p>\u201cWahai orang-orang yang beriman! Jauhilah banyak dari prasangka, sesungguhnya sebagian prasangka itu dosa, dan janganlah kamu mencari-cari kesalahan orang lain, dan janganlah ada di antara kamu yang menggunjing sebagian yang lain. Apakah ada di antara kamu yang suka memakan daging saudaranya yang sudah mati? Tentu kamu merasa jijik. Dan bertakwalah kepada Allah, sesungguhnya Allah Maha Penerima tobat, Maha Penyayang.\u201d</p>' +
        '<p class="ref">Terjemahan Kemenag</p><hr>' +
        '<h4>QS An-Nur 24:16</h4>' +
        '<p class="ar">\u0648\u064E\u0644\u064E\u0648\u0652\u0644\u064E\u0627 \u0625\u0650\u0630\u0652 \u0633\u064E\u0645\u0650\u0639\u0652\u062A\u064F\u0645\u064F\u0648\u0647\u064F \u0642\u064F\u0644\u0652\u062A\u064F\u0645 \u0645\u064E\u0651\u0627 \u064A\u064E\u0643\u064F\u0648\u0646\u064F \u0644\u064E\u0646\u064E\u0627 \u0623\u064E\u0646 \u0646\u064E\u0651\u062A\u064E\u0643\u064E\u0644\u064E\u0651\u0645\u064E \u0628\u0650\u0647\u064E\u0670\u0630\u064E\u0627 \u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0647\u064E\u0670\u0630\u064E\u0627 \u0628\u064F\u0647\u0652\u062A\u064E\u0627\u0646\u064C \u0639\u064E\u0638\u0650\u064A\u0645\u064C</p>' +
        '<p>\u201cDan mengapa kamu tidak berkata, ketika mendengarnya, \u2018Tidak pantas bagi kita membicarakan ini. Mahasuci Engkau, ini adalah kebohongan yang besar.\u2019\u201d</p>' +
        '<p class="ref">Terjemahan Kemenag. Konteks ayat: peristiwa tuduhan terhadap Aisyah, ayat 11\u201320.</p><hr>' +
        '<h4>Hadis</h4>' +
        '<p>Rasulullah bertanya, \u201cTahukah kalian apa itu ghibah?\u201d Para sahabat menjawab, \u201cAllah dan Rasul-Nya lebih tahu.\u201d Beliau bersabda, \u201cEngkau menyebut saudaramu dengan sesuatu yang tidak ia sukai.\u201d Ditanyakan, \u201cBagaimana jika yang kukatakan memang ada padanya?\u201d Beliau menjawab, \u201cJika memang ada padanya, engkau telah mengghibahnya; jika tidak ada, engkau telah memfitnahnya.\u201d</p>' +
        '<p class="ref">HR Muslim no. 2589, sahih</p>' +
        '<p>\u201cBarangsiapa menutupi aib seorang muslim, Allah akan menutupi aibnya di dunia dan akhirat.\u201d</p>' +
        '<p class="ref">HR Muslim no. 2699, sahih</p><hr>' +
        '<h4>Catatan</h4>' +
        '<p>Ayat 24:16 memberi kalimat yang bisa langsung diketik saat sebuah tangkapan layar datang. Menutup layar menjaga diri sendiri; menegur pengirim menjaga orang lain. Keduanya tidak mengembalikan apa yang sudah tersebar, tetapi keduanya menentukan siapa yang ikut menyebarkannya.</p>' +
        '<span class="badge">Belum direview ulama</span>'
    },

  function step() {
    if (!EP || busy || waiting || ended) return;
    var lines = EP.knots[knot];

      case 'view':
        setHeader(line.name, line.initial, line.sub); pill(line.pill); step(); return;
      case 'set':
        vars[line.v] = true; step(); return;
      case 'go':
        knot = line.to; idx = 0; step(); return;
      case 'branch':
        var c = pick(line.cases); if (c) { knot = c.to; idx = 0; } step(); return;
      case 'nar':
        if (line.cases) { var n = pick(line.cases); if (n) narration(n.text); else step(); return; }
        if (line.cond && !truthy(line.cond)) { step(); return; }
        narration(line.text); return;
      case 'in':
        if (line.cond && !truthy(line.cond)) { step(); return; }
        bubbleIn(line.text, line.from); return;
      case 'out':
        bubbleOut(line.text, line.attach); return;
      case 'typing':
        typing(function () { setHint('Ketuk untuk lanjut'); step(); }); return;
      case 'shot':
        shot(line.state); return;
      case 'sys':
        pill(line.text); return;
      case 'notif':
        notif(line); return;
      case 'bank':
        bank(line); return;

      '<div><button class="btn" type="button" id="simpan">Simpan di HP ini</button></div><p class="note" id="simpanNote"></p>';
    append(ref);
    var ta = ref.querySelector('#refleksi');
    var rk = 'qissa.' + EP.id + '.refleksi';
    var saved = load(rk); if (saved) ta.value = saved;
    ref.querySelector('#simpan').addEventListener('click', function () {
      var note = ref.querySelector('#simpanNote');
      try { window.localStorage.setItem(rk, ta.value); note.textContent = 'Tersimpan di HP ini.'; }
      catch (e) { note.textContent = 'Tidak bisa menyimpan di browser ini. Salin teksnya kalau ingin disimpan.'; }
    });

    var share = el('section', 'card');
    share.innerHTML = '<h3>Lu bakal gimana?</h3><p>Bagikan dilemanya ke teman. Pilihanmu tidak ikut terkirim.</p>' +
      '<div><button class="btn" type="button" id="bagikan">Bagikan dilemanya</button>' +
      '<button class="btn ghost" type="button" id="masukan">Kirim masukan ke pembuat</button></div><p class="note" id="shareNote"></p>';
    append(share);
    share.querySelector('#bagikan').addEventListener('click', function () { track('bagikan', { ep: EP.id }); send(shareText(), share.querySelector('#shareNote')); });
    share.querySelector('#masukan').addEventListener('click', function () { track('masukan', { ep: EP.id }); send(feedbackText(), share.querySelector('#shareNote')); });

    if (CONFIG.waChannel) {
      var chan = el('section', 'chan');
      chan.innerHTML = '<p>' + (EP.next ? 'Episode baru terbit di Saluran WhatsApp Qissa.' : 'Episode 3 terbit di Saluran WhatsApp Qissa. Ikuti supaya tidak terlewat.') + '</p><a class="btn" id="chanEnd" href="' + CONFIG.waChannel + '" target="_blank" rel="noopener">Ikuti saluran</a>';
      chan.querySelector('#chanEnd').addEventListener('click', function () { track('saluran', { dari: EP.id }); });
      append(chan);
    }

    var again = el('section', 'card');
    var nextBtn = EP.next ? '<button class="btn" type="button" id="lanjut">Lanjut ke Episode ' + EPISODES[EP.next].num + '</button>' : '';
    again.innerHTML = '<h3>' + (EP.next ? 'Lanjut, atau coba pilihan lain?' : 'Kalau tadi milih yang lain?') + '</h3>' +
      (EP.next ? '' : '<p>Episode 3, Grup Keluarga, menyusul.</p>') +
      '<div>' + nextBtn +
      '<button class="btn ghost" type="button" id="ulang2">Ulang dari Pilihan 2</button>' +
      '<button class="btn ghost" type="button" id="ulang1">Ulang dari awal</button>' +
      '<button class="btn ghost" type="button" id="daftar">Daftar episode</button></div>';
    append(again);
    if (EP.next) again.querySelector('#lanjut').addEventListener('click', function () { open(EP.next); });
    again.querySelector('#ulang2').addEventListener('click', function () { restore('p2'); });
    again.querySelector('#ulang1').addEventListener('click', function () { open(EP.id); });
    again.querySelector('#daftar').addEventListener('click', home);
  }

  function shareText() {
    return EP.share + (SHARE_URL.indexOf('http') === 0 ? '\n' + SHARE_URL + '#' + EP.id : '');
  }
  function feedbackText() {
    return 'Masukan untuk Qissa, Episode ' + EP.num + ' (' + EP.title + ')\nJalur saya: ' + path.join(' \u2192 ') +
      '\n\n1. Bagian yang saya skip:\n2. Kata atau kalimat yang ketuaan:\n3. Pilihan saya dan kenapa:\n4. Ada momen terasa diceramahin? Di mana:\n5. Kartu bagikannya bakal saya kirim ke:\n';
  }
  function send(text, note) {
    if (navigator.share) {
      navigator.share({ text: text }).then(function () { note.textContent = ''; }).catch(function () { copy(text, note); });
    } else { copy(text, note); }
  }
  function copy(text, note) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { note.textContent = 'Teks tersalin. Tempel di WhatsApp atau mana saja.'; }, function () { note.textContent = 'Tidak bisa menyalin otomatis di browser ini.'; });
    } else { note.textContent = 'Tidak bisa menyalin otomatis di browser ini.'; }
  }

  function restore(key) {
    var s = snaps[key];
    if (!s) { open(EP.id); return; }
    log.innerHTML = s.html;
    vars = JSON.parse(JSON.stringify(s.vars));
    knot = s.knot; idx = s.idx; path = s.path.slice();
    busy = false; waiting = false; ended = false;
    setHeader(s.header.name, s.header.initial, s.header.sub);
    step();
  }

  function advance() {
    if (!EP || busy || waiting || ended) return;
    if (!started) { started = true; setHint('Ketuk untuk lanjut'); }
    step();
  }

  log.addEventListener('click', function (e) {
    if (e.target.closest('button, a, textarea, input')) return;
    advance();
  });
  hint.addEventListener('click', advance);
  hEp.addEventListener('click', function () { if (EP) home(); });
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); advance(); }
  });

  var h = (window.location.hash || '').replace('#', '');
  if (EPISODES[h]) { open(h); } else { home(); }
})();
</script>
</body>
</html>
